[package]
name = "router"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["sync", "macros", "rt-multi-thread"] }
tracing = "0.1"
thiserror = "1"
dirs = "5"
feishu = { path = "../feishu" }
acp-claude = { path = "../acp-claude" }

[dev-dependencies]
tempfile = "3"
