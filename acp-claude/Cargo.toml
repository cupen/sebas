[package]
name = "acp-claude"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
rand = "0.8"
agent-client-protocol = { workspace = true }
