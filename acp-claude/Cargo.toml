[package]
name = "acp-claude"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
# Post-ACP engine: claude stream-json + control protocol client.
# Pinned exact (design K7: low-adoption single-maintainer crate).
cc-agent-sdk = "=0.1.6"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

# Test fake speaking the claude stream-json + control-protocol dialect
# (scenarios: hello/bash/deny/thinking; --loop/--hang-on-init/... flags).
[[bin]]
name = "fake-claude-cli"
path = "tests/bin/fake_claude_cli.rs"
