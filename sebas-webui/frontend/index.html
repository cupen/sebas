<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0c11" />
    <title>sebas console</title>
    <script>
      // Theme pre-paint (inline: the module bundle runs too late and a
      // light-OS user would flash dark). Mirrors src/react/boundary/preferences.ts
      // — `data-theme` on <html> is the single switch, and Settings →
      // Appearance persists 'sebas:theme'.
      ;(() => {
        let mode = 'system'
        try {
          mode = localStorage.getItem('sebas:theme') || 'system'
        } catch {}
        const light =
          mode === 'light' ||
          (mode === 'system' &&
            typeof matchMedia === 'function' &&
            matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
      })()
    </script>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <div id="react-root"></div>
    <script type="module" src="/src/react/main.tsx"></script>
  </body>
</html>
