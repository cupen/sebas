[package]
name = "sebas-webui"
version = "0.1.0"
edition = "2024"

[dependencies]
sebas-router = { path = "../sebas-router" }
sebas-feishu = { path = "../sebas-feishu" }
sebas-acp-claude = { path = "../sebas-acp-claude" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
minijinja = "2.0"
chrono = "0.4"
urlencoding = "2"
async-trait = "0.1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
