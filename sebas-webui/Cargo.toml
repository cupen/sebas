[package]
name = "sebas-webui"
version = "0.1.0"
edition = "2024"

[dependencies]
sebas-router = { path = "../sebas-router" }
sebas-feishu = { path = "../sebas-feishu" }
sebas-acp = { path = "../sebas-acp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
chrono = "0.4"
urlencoding = "2"
async-trait = "0.1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
futures-util = "0.3.34"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5", features = ["util"] }
