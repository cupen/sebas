[package]
name = "sebas-webui"
version = "0.1.0"
edition = "2024"

[dependencies]
sebas-dispatch = { path = "../sebas-dispatch" }
sebas-feishu = { path = "../sebas-feishu" }
sebas-channels = { path = "../sebas-channels" }
sebas-acp = { path = "../sebas-acp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 鉴权：PBKDF2-HMAC-SHA256 密码哈希 + OS CSPRNG（盐 / 会话 token）。
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"
dirs = "7"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["ws"] }
tracing = "0.1"
chrono = "0.4"
urlencoding = "2"
# add-webui-picker-workdir-start：browse-dirs 回显路径剥 Windows verbatim
# 前缀（UNC / 长路径等剥离会破坏语义的形态保守保留，正确性由 safe_path
# 的入参归一兜底）。
dunce = "1"
async-trait = "0.1"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
futures-util = "0.3.34"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5", features = ["util"] }
