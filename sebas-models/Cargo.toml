[package]
name = "sebas-models"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

# core 各表的 ActiveRecord struct（extract-sebas-db D2）：一表一 struct、
# 一行一实例。impl 与 struct 同 crate（孤儿规则），而 impl 依赖 rusqlite——
# 放 sebas-db 会让 runtime 认识域表，放根 crate 则 webui 够不着，故独立成库。
# 消费方是 core 与 webui；sebas-node 不依赖它（节点依赖图里没有 SQLite）。
[dependencies]
# 持久层 runtime：连接/同步/单写 actor + ActiveRecord 生成代码引用的
# `::sebas_db::record::Record`。
sebas-db = { path = "../sebas-db" }
# runtime_state 的 ProviderMode / DefaultSelection 词表（仍是词表的部分——
# `ProjectRow` ↔ `ProjectEntry` 的转换已随两者合并消失，不再是这里的理由）。
sebas-domain = { path = "../sebas-domain" }
# ActiveRecord 生成器（SchemaColumns + ActiveRecord）。
sebas-schema-derive = { path = "../sebas-schema-derive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# `project_id_for_on`：项目记录的稳定 id 派生（sha256 → `proj-<12hex>`）。
# 该规则随项目记录同处（add-domain-layer D5「放置规则」：唯一形态既是域对象
# 又是持久行的概念，定义在拥有该表的 crate），故依赖落在这里而非中立层。
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
