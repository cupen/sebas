[package]
name = "sebas-dispatch"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["sync", "macros", "rt-multi-thread"] }
tracing = "0.1"
thiserror = "2"
anyhow = "1"
sebas-channels = { path = "../sebas-channels" }
# provider 卡片展示/探测需读内置 preset 表（preset 数据跟随代码）。
sebas-router = { path = "../sebas-router" }
sebas-acp = { path = "../sebas-acp" }
# 中立共享域层（add-domain-layer）：跨角色域概念的唯一定义处。
sebas-domain = { path = "../sebas-domain" }
# session_map 表的 ActiveRecord 行（persist-session-map 1.2：行与映射持久化
# 形状合一；映射 ↔ 行的转换在本 crate，行定义在 models）。
sebas-models = { path = "../sebas-models" }
async-trait = "0.1"
# 仅 provider 探测 `/v1/models` 用，少量依赖；rustls-tls 省掉 native-tls 链接。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = "3"
