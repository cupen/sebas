[package]
name = "sebas"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace]
resolver = "2"
members = ["sebas-router", "sebas-feishu", "sebas-acp", "sebas-gateway", "sebas-webui", "xtask", "sebas-agent"]

# Debug profile: 产物最小化
[profile.dev]
opt-level = "z"        # 体积优先
# lto = true             # 跨 crate LTO
codegen-units = 1      # 单 codegen unit，最大化内联/去重
panic = "abort"        # 去掉 unwinding 表与 landing pads
strip = true           # 移除符号表
debug = false          # 不带 debug info


[profile.release]
lto = true
debug = false


[dependencies]
sebas-router = { path = "sebas-router" }
sebas-feishu = { path = "sebas-feishu" }
sebas-acp = { path = "sebas-acp" }
sebas-gateway = { path = "sebas-gateway" }
sebas-webui = { path = "sebas-webui" }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
libc = "0.2"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
futures-util = "0.3"
async-trait = "0.1"

# Feishu WebSocket long-connection inbound. v0.19.0+ adds `register_raw`
# which sidesteps the dispatcher-key bug present in v0.14.0 (handlers
# never matched because registered keys vs. emit keys were different).
openlark = { version = "0.20", default-features = false, features = ["communication", "websocket"] }
cc-agent-sdk = { version = "0.1.7"}
# cc-agent-sdk = { version = "0.1.6", path = "vendor/cc-agent-sdk" }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
libc = "0.2"

[[bin]]
name = "sebas"
path = "src/main.rs"

[[bin]]
name = "fake-claude"
path = "tests/bin/fake-claude.rs"
