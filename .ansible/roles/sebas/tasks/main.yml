---
# sebas role — task dispatcher.
#
# The role's behavior is selected by `sebas_action` (see defaults/main.yml):
#   install   — provision and start the sebas service (default, tasks/install.yml)
#   uninstall — tear everything down: service, binaries, data/secrets, user
#               (DESTRUCTIVE, tasks/uninstall.yml)
#
# The whitelist assertion is deliberately the first task in the play: an
# illegal value must fail before any task touches the target host.

- name: Assert sebas_action is one of the legal values
  ansible.builtin.fail:
    msg: >-
      sebas_action must be 'install' or 'uninstall' (got '{{ sebas_action }}').
      Pass it explicitly, e.g. -e sebas_action=uninstall. Omitting the variable
      keeps the default (install).
  when: sebas_action not in ['install', 'uninstall']

- name: Run the install flow
  ansible.builtin.include_tasks: install.yml
  when: sebas_action == 'install'

- name: Run the uninstall flow
  ansible.builtin.include_tasks: uninstall.yml
  when: sebas_action == 'uninstall'
