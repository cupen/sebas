# nginx vhost for sebas — manual apply.
#
# This file is NOT wired into the ansible playbook. It is a starting point
# to be reviewed, filled in, and dropped into /etc/nginx/sites-enabled/ (or
# included from /etc/nginx/nginx.conf) by the operator. The ansible role
# only deploys sebas itself; reverse-proxying / TLS termination is the
# operator's existing nginx setup's job.
#
# Two placeholders to fill in:
#   __SEBAS_DOMAIN__   — public DNS name pointing at this host
#   __UPSTREAM_HOST__  — usually 127.0.0.1; must match the host sebas binds
#   __UPSTREAM_PORT__  — must match the port in [watchdog.webui] in
#                        /home/sebas/.sebas/config.toml (default 9797)
# After editing, validate with `sudo nginx -t` then `sudo nginx -s reload`.

# --- HTTP → HTTPS redirect (drop this server block if you only want plain HTTP) ---
server {
    listen 80;
    listen [::]:80;
    server_name __SEBAS_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS reverse proxy to sebas ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SEBAS_DOMAIN__;

    # ssl_certificate     /etc/letsencrypt/live/__SEBAS_DOMAIN__/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/__SEBAS_DOMAIN__/privkey.pem;

    # sebas streams SSE; disable buffering on the proxy leg.
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;

    location / {
        proxy_pass http://__UPSTREAM_HOST__:__UPSTREAM_PORT__;
    }
}
