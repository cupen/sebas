[package]
name = "sebas-domain"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `SessionInfo.usage` 与 `SessionInfo::channel_key` 引用 channels 的中立类型
# （add-domain-layer 3.1：类型按 D3 原样搬迁，字段类型不换）。
sebas-channels = { path = "../sebas-channels" }
# 注（type-session-vocabularies）：此前还依赖 `sebas-acp`（仅为
# `AvailableCommand`）。那条依赖边使 `sebas-acp` 无法反向取用本层的共享词汇
# （审批决定的唯一定义会造成 crate 循环），故 `AvailableCommand` 已移入本层
# `session` 模块、该依赖删除；`sebas_acp::AvailableCommand` 由 acp 侧 `pub use`
# 原位再导出，公开路径与线形状不变。
# `prim::expand_tilde` 的 home 目录解析（Known Folder，不吃 HOME env）。
dirs = "7"

[dev-dependencies]
# 状态目录测试的一次性目录（state_paths 测试隔离进程级 env）。
tempfile = "3"
