[package]
name = "sebas-acp"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
# Post-ACP engine: claude stream-json + control protocol client.
# Unknown message types from the CLI are handled at the Err() level
# in the driver's receive loop; no need for a vendored Unknown variant.
cc-agent-sdk = "0.1.7"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
agent-client-protocol = "2.0.0"

[dev-dependencies]
tempfile = "3"

# Test fake speaking the claude stream-json + control-protocol dialect.
# Shares the workspace-root source with sebas's `fake-claude` bin — the two
# binaries are byte-identical apart from the name, so sebas-acp keeps its
# own test binary name without a second copy of the code.
[[bin]]
name = "fake-claude-cli"
path = "../tests/bin/fake-claude.rs"

# Programmable mock ACP agent (the agent/stdio side) for the ACP resume
# integration tests. Scenario-selected via argv (unavailable | load-fails |
# load-ok), logs received request methods to an optional --journal path.
[[bin]]
name = "fake-acp-agent"
path = "tests/bin/fake-acp-agent.rs"
