<div id="sebas-blueprint">
<style>
#sebas-blueprint {
  --sb-canvas: #06080c;
  --sb-surface: #10141c;
  --sb-surface2: #161b26;
  --sb-surface3: #1d2432;
  --sb-well: #0b0e15;
  --sb-border: #212a3a;
  --sb-border-strong: #313d52;
  --sb-text: #dde3ee;
  --sb-bright: #f3f6fb;
  --sb-dim: #939db1;
  --sb-faint: #5f6a80;
  --sb-accent: #8b93ff;
  --sb-accent-strong: #5b64f2;
  --sb-accent-soft: rgba(139, 147, 255, 0.13);
  --sb-accent-border: rgba(139, 147, 255, 0.38);
  --sb-signal: #ff9457;
  --sb-ok: #46d189;
  --sb-warn: #f2b04e;
  --sb-err: #f47174;
  --sb-info: #6ea8fe;
  --sb-wait: #c08cff;
  --sb-dormant: #94a0b4;
  --sb-shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
  --sb-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --sb-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  color: var(--sb-text);
  font-family: var(--sb-font);
  font-size: 13px;
  line-height: 1.55;
  background: transparent;
  width: 100%;
  min-width: 0;
}
.sb-window[data-theme="light"] {
  --sb-canvas: #e7e9f1;
  --sb-surface: #ffffff;
  --sb-surface2: #f3f5f9;
  --sb-surface3: #e9edf5;
  --sb-well: #f6f8fa;
  --sb-border: #dfe3ec;
  --sb-border-strong: #c6cedd;
  --sb-text: #1b2230;
  --sb-bright: #0b1220;
  --sb-dim: #5b6577;
  --sb-faint: #7a8496;
  --sb-accent: #4f5bd5;
  --sb-accent-strong: #4350c9;
  --sb-accent-soft: rgba(79, 91, 213, 0.1);
  --sb-accent-border: rgba(79, 91, 213, 0.38);
  --sb-signal: #b45309;
  --sb-ok: #177a4b;
  --sb-warn: #9a6206;
  --sb-err: #b4232a;
  --sb-info: #1f5fa8;
  --sb-wait: #7a3fb8;
  --sb-dormant: #6b7688;
  --sb-shadow: 0 12px 32px rgba(20, 28, 45, 0.16);
}
#sebas-blueprint *, #sebas-blueprint *::before, #sebas-blueprint *::after { box-sizing: border-box; }
#sebas-blueprint button { font: inherit; }
#sebas-blueprint input, #sebas-blueprint textarea, #sebas-blueprint select {
  font: inherit; color: inherit;
}
#sebas-blueprint button { cursor: pointer; }
#sebas-blueprint button:focus-visible,
#sebas-blueprint a:focus-visible,
#sebas-blueprint input:focus-visible,
#sebas-blueprint textarea:focus-visible,
#sebas-blueprint select:focus-visible,
#sebas-blueprint [tabindex]:focus-visible {
  outline: 2px solid var(--sb-accent);
  outline-offset: 2px;
}
#sebas-blueprint a { color: var(--sb-accent); }

/* ---------- blueprint chrome ---------- */
.sb-chrome {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  padding: 10px 12px; margin-bottom: 10px;
  background: var(--sb-surface); border: 1px solid var(--sb-border);
  border-radius: 10px;
}
.sb-chrome-group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.sb-chrome-label { font-size: 11px; color: var(--sb-dim); letter-spacing: .04em; margin-right: 4px; }
.sb-titlebar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; margin-bottom: 8px; }
.sb-titlebar h2 { margin: 0; font-size: 16px; font-weight: 500; color: var(--sb-bright); }
.sb-draft-badge {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--sb-signal); color: var(--sb-signal);
  border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 500;
}
.sb-draft-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.sb-note { color: var(--sb-dim); font-size: 12px; }

.sb-seg { display: inline-flex; border: 1px solid var(--sb-border); border-radius: 7px; overflow: hidden; }
.sb-seg button {
  border: 0; background: transparent; color: var(--sb-dim);
  padding: 4px 9px; font-size: 12px; line-height: 1.4; white-space: nowrap;
}
.sb-seg button + button { border-left: 1px solid var(--sb-border); }
.sb-seg button[aria-pressed="true"] { background: var(--sb-accent-soft); color: var(--sb-bright); box-shadow: inset 0 -2px 0 var(--sb-accent); }
.sb-switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sb-dim); }
.sb-switch input { accent-color: var(--sb-accent); width: 15px; height: 15px; }
.sb-select {
  background: var(--sb-surface2); border: 1px solid var(--sb-border); color: var(--sb-text);
  border-radius: 7px; padding: 4px 8px; font-size: 12px;
}
.sb-demo {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  padding: 8px 10px; margin-bottom: 10px;
  border: 1px dashed var(--sb-border-strong); border-radius: 9px;
  background: color-mix(in srgb, var(--sb-surface) 65%, transparent);
}
.sb-demo-label { font-size: 11px; color: var(--sb-dim); letter-spacing: .04em; }

/* ---------- generic product controls ---------- */
.sb-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  border: 1px solid var(--sb-border); background: var(--sb-surface2); color: var(--sb-text);
  border-radius: 7px; padding: 4px 10px; font-size: 12px; min-height: 28px;
}
.sb-btn:hover { border-color: var(--sb-border-strong); background: var(--sb-surface3); }
.sb-btn-primary { background: var(--sb-accent-strong); border-color: var(--sb-accent-strong); color: #fff; }
.sb-btn-primary:hover { background: var(--sb-accent); border-color: var(--sb-accent); }
.sb-btn-danger { color: var(--sb-err); border-color: color-mix(in srgb, var(--sb-err) 45%, var(--sb-border)); }
.sb-btn-ghost { background: transparent; border-color: transparent; color: var(--sb-dim); }
.sb-btn-ghost:hover { color: var(--sb-text); background: var(--sb-surface2); }
.sb-btn:disabled { opacity: .45; cursor: not-allowed; }
.sb-btn-sm { min-height: 24px; padding: 2px 7px; font-size: 11px; }
.sb-icon-btn {
  width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent; background: transparent; color: var(--sb-dim); border-radius: 6px;
}
.sb-icon-btn:hover { background: var(--sb-surface2); color: var(--sb-text); }
.sb-glyph { font-family: var(--sb-mono); font-size: 13px; line-height: 1; }
.sb-chip {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--sb-border); background: var(--sb-surface2);
  border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--sb-dim); white-space: nowrap;
}
.sb-chip-ok { color: var(--sb-ok); border-color: color-mix(in srgb, var(--sb-ok) 35%, var(--sb-border)); }
.sb-chip-warn { color: var(--sb-warn); border-color: color-mix(in srgb, var(--sb-warn) 35%, var(--sb-border)); }
.sb-chip-err { color: var(--sb-err); border-color: color-mix(in srgb, var(--sb-err) 40%, var(--sb-border)); }
.sb-chip-signal { color: var(--sb-signal); border-color: color-mix(in srgb, var(--sb-signal) 40%, var(--sb-border)); }
.sb-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.sb-dot-square { border-radius: 2px; }
.sb-dot-ring { background: transparent; border: 1.5px solid currentColor; }

/* ---------- app window ---------- */
.sb-window {
  position: relative; display: flex; width: 100%; max-width: 1440px; margin: 0 auto;
  min-height: 620px; height: 640px;
  background: var(--sb-canvas); color: var(--sb-text);
  border: 1px solid var(--sb-border);
  border-radius: 12px; overflow: hidden; box-shadow: var(--sb-shadow);
}
.sb-window.bp-1024 { max-width: 1024px; }
.sb-window.bp-768 { max-width: 768px; }
.sb-window.bp-375 { max-width: 375px; }
.sb-window.bp-375, .sb-window.bp-768 { height: 720px; }
.sb-window.auth-mode .sb-rail,
.sb-window.auth-mode .sb-topbar,
.sb-window.auth-mode .sb-scrim { display: none; }
.sb-window.auth-mode .sb-stage { min-height: 0; }

.sb-rail {
  display: flex; flex-direction: column; gap: 6px; flex: none;
  width: var(--sb-rail-width, 280px); min-width: 0;
  background: var(--sb-surface); border-right: 1px solid var(--sb-border);
  padding: 10px 9px; z-index: 4;
}
.sb-rail-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 8px; }
.sb-brand { display: flex; align-items: center; gap: 8px; min-width: 0; text-decoration: none; color: var(--sb-bright); }
.sb-brand-mark {
  width: 24px; height: 24px; border-radius: 7px; flex: none;
  display: grid; place-items: center; font-family: var(--sb-mono); font-size: 13px;
  color: #fff; background: var(--sb-accent-strong);
}
.sb-brand-name { font-weight: 500; font-size: 14px; line-height: 1.15; }
.sb-brand-sub { display: block; font-size: 10px; color: var(--sb-faint); font-weight: 400; letter-spacing: .04em; }
.sb-rail-actions { display: flex; flex-direction: column; gap: 2px; }
.sb-rail-link {
  display: flex; align-items: center; gap: 8px; width: 100%;
  border: 0; background: transparent; color: var(--sb-dim); border-radius: 7px;
  padding: 6px 8px; text-align: left; font-size: 12px;
}
.sb-rail-link:hover { background: var(--sb-surface2); color: var(--sb-text); }
.sb-rail-link.active { background: var(--sb-surface3); color: var(--sb-bright); }
.sb-rail-section { margin-top: 8px; min-height: 0; display: flex; flex-direction: column; flex: 1; }
.sb-rail-label {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10px; letter-spacing: .12em; color: var(--sb-faint);
  padding: 4px 6px; text-transform: uppercase;
}
.sb-rail-scroll { overflow: auto; min-height: 0; }
.sb-project-row {
  display: flex; align-items: center; gap: 6px; width: 100%;
  border: 0; background: transparent; color: var(--sb-text); text-align: left;
  padding: 5px 6px; border-radius: 6px; font-size: 12px;
}
.sb-project-row:hover { background: var(--sb-surface2); }
.sb-project-row.current { background: var(--sb-accent-soft); color: var(--sb-bright); }
.sb-project-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-count { font-size: 10px; color: var(--sb-faint); }
.sb-session-list { list-style: none; margin: 1px 0 3px; padding: 0 0 0 14px; border-left: 1px solid var(--sb-border); }
.sb-session-row {
  display: flex; align-items: center; gap: 6px; width: 100%;
  border: 0; background: transparent; color: var(--sb-dim); text-align: left;
  padding: 4px 5px; border-radius: 5px; font-size: 11.5px;
}
.sb-session-row:hover { background: var(--sb-surface2); color: var(--sb-text); }
.sb-session-row.focused { background: var(--sb-accent-soft); color: var(--sb-bright); }
.sb-session-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-badge { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--sb-accent-strong); color: #fff; font-size: 10px; display: inline-flex; align-items: center; justify-content: center; }
.sb-rail-foot { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--sb-border); padding-top: 6px; }
.sb-rail-collapsed .sb-rail-text { display: none; }
.sb-rail-collapsed { --sb-rail-width: 60px; }
.sb-rail-collapsed .sb-brand-name, .sb-rail-collapsed .sb-brand-sub, .sb-rail-collapsed .sb-rail-label span:first-child { display: none; }
.sb-rail-collapsed .sb-rail-label { justify-content: center; }
.sb-rail-collapsed .sb-project-row, .sb-rail-collapsed .sb-session-row { justify-content: center; }
.sb-rail-collapsed .sb-project-name, .sb-rail-collapsed .sb-session-name, .sb-rail-collapsed .sb-count, .sb-rail-collapsed .sb-badge { display: none; }

.sb-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sb-topbar {
  display: flex; align-items: center; gap: 10px; min-height: 46px;
  padding: 6px 12px; border-bottom: 1px solid var(--sb-border);
  background: color-mix(in srgb, var(--sb-surface) 80%, transparent);
}
.sb-topbar-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.sb-topbar-title { font-weight: 500; color: var(--sb-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-topbar-sub { color: var(--sb-dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-topbar-tools { display: flex; align-items: center; gap: 6px; flex: none; }
.sb-menu-btn { display: none; }
.sb-url { font-family: var(--sb-mono); font-size: 10.5px; color: var(--sb-faint); border: 1px solid var(--sb-border); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }

.sb-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.sb-stage-scroll { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px 8px; }
.sb-content { width: 100%; max-width: 800px; margin: 0 auto; }

/* todo region */
.sb-todo { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; max-height: 240px; overflow: auto; padding-right: 2px; }
.sb-todo-head { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--sb-dim); }
.sb-todo-head strong { color: var(--sb-text); font-weight: 500; }
.sb-todo-count { color: var(--sb-signal); }
.sb-card {
  border: 1px solid var(--sb-border); background: var(--sb-surface);
  border-radius: 9px; padding: 9px 10px;
}
.sb-approval { border-color: color-mix(in srgb, var(--sb-signal) 42%, var(--sb-border)); }
.sb-approval-head { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
.sb-approval-title { font-weight: 500; color: var(--sb-bright); font-size: 12px; }
.sb-approval-tool { font-family: var(--sb-mono); font-size: 11px; color: var(--sb-signal); }
.sb-args {
  font-family: var(--sb-mono); font-size: 11px; color: var(--sb-dim);
  background: var(--sb-well); border: 1px solid var(--sb-border);
  border-radius: 6px; padding: 5px 7px; margin: 5px 0 7px;
  white-space: pre-wrap; word-break: break-word; max-height: 62px; overflow: auto;
}
.sb-approval-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.sb-approval-decision { font-size: 11px; color: var(--sb-dim); }
.sb-queue-row { display: flex; align-items: center; gap: 7px; padding: 4px 0; font-size: 11.5px; }
.sb-queue-row + .sb-queue-row { border-top: 1px solid var(--sb-border); }
.sb-queue-index { font-family: var(--sb-mono); color: var(--sb-faint); font-size: 10px; width: 18px; }
.sb-queue-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--sb-text); }
.sb-error-row { border-color: color-mix(in srgb, var(--sb-err) 40%, var(--sb-border)); }

/* transcript */
.sb-transcript { display: flex; flex-direction: column; gap: 13px; }
.sb-entry { display: flex; flex-direction: column; gap: 4px; max-width: 760px; }
.sb-entry-user { align-self: flex-end; align-items: flex-end; width: min(100%, 620px); }
.sb-entry-meta { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--sb-faint); }
.sb-bubble {
  background: var(--sb-surface); border: 1px solid var(--sb-border);
  border-radius: 9px; padding: 8px 10px; color: var(--sb-text);
  overflow-wrap: anywhere;
}
.sb-entry-user .sb-bubble { background: var(--sb-accent-soft); border-color: var(--sb-accent-border); }
.sb-entry-assistant .sb-bubble { background: var(--sb-surface); }
.sb-live { border-style: dashed; }
.sb-live::after { content: "▍"; color: var(--sb-accent); margin-left: 2px; }
.sb-reduced .sb-live::after { content: "…"; color: var(--sb-dim); }
.sb-seam { display: flex; align-items: center; gap: 8px; color: var(--sb-signal); font-size: 10.5px; margin: 2px 0; }
.sb-seam::before, .sb-seam::after { content: ""; height: 1px; background: color-mix(in srgb, var(--sb-signal) 45%, var(--sb-border)); flex: 1; }
.sb-fold { border: 1px solid var(--sb-border); background: var(--sb-surface2); border-radius: 8px; overflow: hidden; }
.sb-fold summary {
  list-style: none; display: flex; align-items: center; gap: 7px;
  padding: 5px 8px; cursor: pointer; color: var(--sb-dim); font-size: 11px;
}
.sb-fold summary::-webkit-details-marker { display: none; }
.sb-fold summary:hover { color: var(--sb-text); }
.sb-fold-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-fold-body { border-top: 1px solid var(--sb-border); padding: 7px 9px; color: var(--sb-dim); font-size: 11.5px; background: var(--sb-well); }
.sb-code { font-family: var(--sb-mono); font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere; }
.sb-tool-result { color: var(--sb-ok); font-size: 11px; }
.sb-notice-entry { border-color: color-mix(in srgb, var(--sb-warn) 38%, var(--sb-border)); color: var(--sb-dim); }

/* composer */
.sb-composer-wrap { flex: none; padding: 8px 16px 12px; background: linear-gradient(to top, var(--sb-canvas) 70%, transparent); }
.sb-composer {
  max-width: 800px; margin: 0 auto; border: 1px solid var(--sb-border-strong);
  background: var(--sb-surface); border-radius: 11px; padding: 8px 9px;
  box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.18);
}
.sb-composer textarea {
  width: 100%; resize: none; border: 0; background: transparent; color: var(--sb-text);
  min-height: 52px; max-height: 120px; padding: 2px 2px 4px; outline: none; font-size: 13px;
}
.sb-composer textarea::placeholder { color: var(--sb-faint); }
.sb-composer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 4px; }
.sb-composer-tools { display: flex; align-items: center; gap: 5px; min-width: 0; flex-wrap: wrap; }
.sb-composer-right { display: flex; align-items: center; gap: 5px; flex: none; }
.sb-mode, .sb-model {
  display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--sb-border);
  background: var(--sb-surface2); color: var(--sb-dim); border-radius: 6px;
  padding: 2px 7px; font-size: 11px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sb-send { min-width: 58px; }
.sb-send-stop { background: color-mix(in srgb, var(--sb-err) 18%, var(--sb-surface2)); border-color: color-mix(in srgb, var(--sb-err) 45%, var(--sb-border)); color: var(--sb-err); }
.sb-composer-hint { max-width: 800px; margin: 5px auto 0; font-size: 10.5px; color: var(--sb-faint); display: flex; justify-content: space-between; gap: 8px; }

/* banner / lock */
.sb-banner {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  border-radius: 7px; border: 1px solid; font-size: 11.5px;
}
.sb-banner-warn { color: #fff; background: #7a4a08; border-color: #a86a0e; }
.sb-banner-fatal { color: #fff; background: #7f1d1d; border-color: #b03030; }
.sb-banner-info { color: var(--sb-info); border-color: color-mix(in srgb, var(--sb-info) 40%, var(--sb-border)); background: color-mix(in srgb, var(--sb-info) 10%, var(--sb-surface)); }
.sb-lock {
  position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--sb-canvas) 72%, transparent); backdrop-filter: blur(1.5px);
}
.sb-lock-panel { max-width: 360px; text-align: center; padding: 16px 18px; border: 1px solid var(--sb-border-strong); border-radius: 11px; background: var(--sb-surface); }
.sb-lock-title { color: var(--sb-bright); font-weight: 500; margin-bottom: 4px; }
.sb-lock-text { color: var(--sb-dim); font-size: 12px; }

/* empty / loading / error */
.sb-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; min-height: 300px; color: var(--sb-dim); }
.sb-empty-mark { width: 44px; height: 44px; border-radius: 11px; border: 1px solid var(--sb-border-strong); display: grid; place-items: center; color: var(--sb-faint); font-family: var(--sb-mono); font-size: 18px; }
.sb-empty-title { color: var(--sb-text); font-size: 13px; }
.sb-empty-hint { font-size: 11.5px; max-width: 420px; }
.sb-callout { display: flex; align-items: flex-start; gap: 8px; border: 1px solid color-mix(in srgb, var(--sb-err) 42%, var(--sb-border)); background: color-mix(in srgb, var(--sb-err) 9%, var(--sb-surface)); border-radius: 8px; padding: 9px 10px; color: var(--sb-text); font-size: 12px; }
.sb-callout strong { color: var(--sb-err); font-weight: 500; }
.sb-skeleton { display: flex; flex-direction: column; gap: 9px; padding-top: 8px; }
.sb-sk-line { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--sb-surface2), var(--sb-surface3), var(--sb-surface2)); background-size: 200% 100%; animation: sb-shimmer 1.4s linear infinite; }
.sb-sk-line.w60 { width: 60%; } .sb-sk-line.w80 { width: 80%; } .sb-sk-line.w40 { width: 40%; }
@keyframes sb-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.sb-reduced .sb-sk-line { animation: none; }

/* pages */
.sb-page { padding: 14px 16px 20px; overflow: auto; flex: 1; min-height: 0; }
.sb-page-inner { max-width: 900px; margin: 0 auto; }

  function usageData() {
    var days = ['10-20', '10-21', '10-22', '10-23', '10-24', '10-25', '10-26'];
    var hours = []; for (var i = 0; i < 24; i++) hours.push(String(i).padStart(2, '0') + ':00');
    var labels = state.usage.gran === 'day' ? days : hours;
    var dims = {
      total: [[120, 180, 90, 240, 310, 220, 280], [60, 70, 80, 120, 160, 90, 110], [20, 30, 25, 45, 60, 40, 50]],
      input: [[80, 110, 60, 150, 200, 140, 180], [40, 45, 55, 80, 100, 60, 70], [15, 20, 18, 30, 40, 28, 32]],
      output: [[30, 50, 20, 60, 80, 60, 75], [15, 18, 20, 28, 38, 22, 28], [4, 7, 6, 10, 14, 9, 12]],
      cache: [[10, 20, 10, 30, 30, 20, 25], [5, 7, 5, 12, 22, 8, 12], [1, 3, 1, 5, 6, 3, 6]]
    };
    var src = state.usage.source;
    var series = dims[state.usage.dim] || dims.total;
    if (src === 'router') series = [series[0]];
    if (src === 'local') series = [series[2]];
    if (state.usage.gran === 'hour') {
      series = series.map(function (line) {
        var out = [];
        for (var i = 0; i < 24; i++) out.push(Math.max(1, Math.round(line[i % line.length] * (0.55 + 0.45 * Math.sin((i + 2) / 3)))));
        return out;
      });
    }
    return { labels: labels, series: series };
  }

  function renderChart() {
    var d = usageData();
    var W = 860, H = 210, padL = 42, padR = 12, padT = 12, padB = 24;
    var all = d.series.reduce(function (a, b) { return a.concat(b); }, []);
    var max = Math.max.apply(null, all) * 1.15 || 1;
    var names = ['claude-sonnet-4-5', 'gpt-5', 'claude-haiku-4-5'];
    var colors = ['var(--sb-accent)', 'var(--sb-ok)', 'var(--sb-warn)'];
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var stepX = d.labels.length > 1 ? innerW / (d.labels.length - 1) : innerW;
    var svg = '<svg class="sb-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="按模型分列的 token 用量折线图">';
    svg += '<title>Token 用量时序</title><desc>横轴为时间，纵轴为 token 数；三条线分别代表一个模型。</desc>';
    for (var g = 0; g <= 4; g++) {
      var gy = padT + innerH * g / 4;
      svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="var(--sb-border)" stroke-width="1" />';
      svg += '<text x="' + (padL - 6) + '" y="' + (gy + 3) + '" text-anchor="end" fill="var(--sb-faint)" font-size="10">' + Math.round(max * (1 - g / 4)) + '</text>';
    }
    var tickEvery = d.labels.length > 10 ? 4 : 1;
    d.labels.forEach(function (lab, i) {
      if (i % tickEvery !== 0 && i !== d.labels.length - 1) return;
      var x = padL + stepX * i;
      svg += '<text x="' + x + '" y="' + (H - 7) + '" text-anchor="middle" fill="var(--sb-faint)" font-size="10">' + esc(lab) + '</text>';
    });
    d.series.forEach(function (line, si) {
      var pts = line.map(function (v, i) { return [padL + stepX * i, padT + innerH * (1 - v / max)]; });
      var path = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
      svg += '<path d="' + path + '" fill="none" stroke="' + colors[si % colors.length] + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" />';
      pts.forEach(function (p) { svg += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2" fill="' + colors[si % colors.length] + '" />'; });
    });
    svg += '</svg>';
    var legend = d.series.map(function (_, i) {
      return '<button type="button" aria-pressed="true" data-act="noop"><span class="sb-legend-swatch" style="color:' + colors[i % colors.length] + '"></span>' + esc(names[i] || ('series ' + (i + 1))) + '</button>';
    }).join('');
    return { svg: svg, legend: legend, data: d };
  }

  function renderUsage() {
    var chart = renderChart();
    var totals = chart.data.series.reduce(function (acc, line) {
      line.forEach(function (v, i) { acc[i] = (acc[i] || 0) + v; });

        + '<div class="sb-stat"><div class="sb-stat-num">' + Math.round(sum * 0.32).toLocaleString() + '</div><div class="sb-stat-label">输出 tokens</div></div>'
        + '<div class="sb-stat"><div class="sb-stat-num">' + Math.round(sum * 0.08).toLocaleString() + '</div><div class="sb-stat-label">缓存 tokens</div></div></div>'

        + '<p class="sb-note" style="margin-top:6px">' + (state.usage.gran === 'day' ? '近 7 天 · 桶边界按本机时区' : '今天 0–23 时 · 桶边界按本机时区') + ' · 来源：' + (state.usage.source === 'all' ? '全部（router + 本地）' : state.usage.source) + ' · 数值为设计稿示意，非真实计量；窄屏图表可横向滚动。</p>';

    return '<div class="sb-page"><div class="sb-page-inner"><div class="sb-page-head"><div><h3 class="sb-page-title">用量</h3><p class="sb-page-sub">Token 消耗时序：按模型分列，天 / 小时两种粒度。</p></div></div>'
      + '<div class="sb-usage-controls">'
      + '<div class="sb-seg" role="group" aria-label="来源"><button type="button" data-act="usage-source" data-value="all" aria-pressed="' + (state.usage.source === 'all') + '">全部</button><button type="button" data-act="usage-source" data-value="router" aria-pressed="' + (state.usage.source === 'router') + '">router</button><button type="button" data-act="usage-source" data-value="local" aria-pressed="' + (state.usage.source === 'local') + '">本地</button></div>'
      + '<div class="sb-seg" role="group" aria-label="粒度"><button type="button" data-act="usage-gran" data-value="day" aria-pressed="' + (state.usage.gran === 'day') + '">按天</button><button type="button" data-act="usage-gran" data-value="hour" aria-pressed="' + (state.usage.gran === 'hour') + '">按小时</button></div>'
      + '<div class="sb-seg" role="group" aria-label="维度"><button type="button" data-act="usage-dim" data-value="total" aria-pressed="' + (state.usage.dim === 'total') + '">总量</button><button type="button" data-act="usage-dim" data-value="input" aria-pressed="' + (state.usage.dim === 'input') + '">输入</button><button type="button" data-act="usage-dim" data-value="output" aria-pressed="' + (state.usage.dim === 'output') + '">输出</button><button type="button" data-act="usage-dim" data-value="cache" aria-pressed="' + (state.usage.dim === 'cache') + '">缓存</button></div>'
      + '</div>' + body + '</div></div>';

  function render() {
    win.setAttribute('data-theme', effectiveTheme());
    root.classList.toggle('sb-reduced', state.reduced);
    win.className = 'sb-window bp-' + state.bp + (state.drawerOpen ? ' drawer-open' : '') + ((state.scenario === 'auth' || state.scenario === 'setup') ? ' auth-mode' : '');
    var railEl = document.getElementById('sb-rail');
    if (railEl) railEl.classList.toggle('sb-rail-collapsed', state.railCollapsed);
    var prevScroller = stageEl.querySelector('.sb-stage-scroll');
    var keepScroll = 0, wasNearBottom = true;
    if (prevScroller) {
      keepScroll = prevScroller.scrollTop;
      wasNearBottom = prevScroller.scrollHeight - prevScroller.scrollTop - prevScroller.clientHeight < 90;
    }
    document.querySelectorAll('#sebas-blueprint [data-act="scenario"]').forEach(function (b) {
      if (b.closest('.sb-chrome')) b.setAttribute('aria-pressed', String(b.getAttribute('data-value') === state.scenario));
    });
    document.querySelectorAll('#sebas-blueprint [data-act="theme"]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-value') === state.theme));
    });
    document.querySelectorAll('#sebas-blueprint [data-act="bp"]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-value') === state.bp));
    });
    renderTree();
    renderTop();
    renderDemoActions();
    if (state.scenario === 'workbench') {
      stageEl.innerHTML = renderWorkbench();
    } else if (state.scenario === 'sessions') {
      stageEl.innerHTML = renderSessions();
    } else if (state.scenario === 'settings') {
      stageEl.innerHTML = renderSettings();
    } else if (state.scenario === 'usage') {
      stageEl.innerHTML = renderUsage();
    } else if (state.scenario === 'auth') {
      stageEl.innerHTML = renderAuth('login');
    } else if (state.scenario === 'setup') {
      stageEl.innerHTML = renderAuth('setup');
    } else {
      stageEl.innerHTML = renderStates();
    }
    var scroller = stageEl.querySelector('.sb-stage-scroll');
    if (scroller) {
      var hasTodo = state.approvals.some(function (a) { return !a.decision; }) || state.queue.length > 0 || state.errorVisible;
      if (!prevScroller && hasTodo && state.scenario === 'workbench') scroller.scrollTop = 0;
      else if (state.streaming || (wasNearBottom && prevScroller)) scroller.scrollTop = scroller.scrollHeight;
      else scroller.scrollTop = keepScroll;
    }
  }

  function findSession(id) {
    for (var i = 0; i < projects.length; i++) {
      for (var j = 0; j < projects[i].sessions.length; j++) {
        if (projects[i].sessions[j].id === id) return { project: projects[i], session: projects[i].sessions[j] };
      }
    }
    return null;
  }

  function addTranscriptNotice(text) {
    entries.push({ id: 'n' + Date.now(), kind: 'notice', text: text });
  }

  var streamTimer = null;
  var streamFull = '正在补统一守卫的测试：401 走登录门、403 走拒绝提示、网络失败保留草稿。测试文件会按现有 colocated 约定放在 client.test.ts，用 fake fetch 覆盖三条路径，不改生产错误文案。';
  function startStream() {
    if (state.streaming) return;
    state.streaming = true;
    state.streamDone = false;
    state.streamingText = '';
    var i = 0;
    render();
    streamTimer = setInterval(function () {
      i = Math.min(streamFull.length, i + 3);
      state.streamingText = streamFull.slice(0, i);
      var t = document.getElementById('sb-live-text');
      if (t) t.textContent = state.streamingText;
      var scroller = stageEl.querySelector('.sb-stage-scroll');
      if (scroller && scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80) scroller.scrollTop = scroller.scrollHeight;
      if (i >= streamFull.length) {
        clearInterval(streamTimer); streamTimer = null;
        state.streaming = false; state.streamDone = true;
        var last = entries.filter(function (e) { return e.kind === 'assistant'; }).slice(-1)[0];
        if (last) { last.text = streamFull; last.status = 'done'; }
        render();
      }
    }, 90);
  }
  function stopStream() {
    if (streamTimer) { clearInterval(streamTimer); streamTimer = null; }
    state.streaming = false;
    var last = entries.filter(function (e) { return e.kind === 'assistant'; }).slice(-1)[0];
    if (last && last.status === 'working') { last.text = state.streamingText || last.text; last.status = 'done'; }
    addTranscriptNotice('回合已停止 · 会话仍可继续；刷新后不复活在飞状态。');
    render();
  }

  root.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var value = el.getAttribute('data-value');
    var id = el.getAttribute('data-id');
    if (act === 'scenario') { state.scenario = value; state.drawerOpen = false; render(); return; }
    if (act === 'theme') { state.theme = value; render(); return; }
    if (act === 'bp') { state.bp = value; render(); return; }
    if (act === 'drawer-open') { state.drawerOpen = true; render(); var c = win.querySelector('[data-act="drawer-close"]'); if (c) c.focus(); return; }
    if (act === 'drawer-close') { state.drawerOpen = false; render(); var m = win.querySelector('[data-act="drawer-open"]'); if (m) m.focus(); return; }
    if (act === 'rail-collapse') { state.railCollapsed = !state.railCollapsed; var rail = document.getElementById('sb-rail'); if (rail) rail.classList.toggle('sb-rail-collapsed', state.railCollapsed); return; }
    if (act === 'select-project') {
      state.project = id; state.drawerOpen = false;
      var p = projects.filter(function (x) { return x.id === id; })[0];
      if (p && p.sessions.length) state.focused = p.sessions[0].id;
      render(); return;
    }
    if (act === 'focus-session') {
      var f = findSession(id);
      if (f) { state.project = f.project.id; state.focused = id; }
      state.scenario = 'workbench'; state.drawerOpen = false; render(); return;
    }
    if (act === 'toggle-history') { state.historyOpen = !state.historyOpen; renderTree(); return; }
    if (act === 'approve' || act === 'deny' || act === 'allow-session') {
      state.approvals.forEach(function (a) {
        if (a.id === id && !a.decision) {
          a.decision = act === 'approve' ? 'once' : act === 'allow-session' ? 'session' : 'deny';
          entries.push({ id: 'd' + a.id, kind: 'notice', text: '审批 ' + a.id + '：' + (act === 'approve' ? '单次允许' : act === 'allow-session' ? '本会话允许（模式切为 Auto）' : '拒绝') + '。工具结果同步写入转录，阅读位置不变。' });
        }
      });
      render(); return;
    }
    if (act === 'queue-up') {
      var qi = state.queue.findIndex(function (q) { return q.id === id; });
      if (qi > 0) { var tmp = state.queue[qi - 1]; state.queue[qi - 1] = state.queue[qi]; state.queue[qi] = tmp; }
      render(); return;
    }
    if (act === 'queue-remove') { state.queue = state.queue.filter(function (q) { return q.id !== id; }); render(); return; }
    if (act === 'dismiss-error') { state.errorVisible = false; render(); return; }
    if (act === 'retry-error') { addTranscriptNotice('已重试本回合；迟到帧仍按游标隔离。'); state.errorVisible = false; render(); return; }
    if (act === 'retry-load') { state.demo = 'normal'; render(); return; }
    if (act === 'send') {
      var input = document.getElementById('sb-composer-input');
      var text = input ? input.value.trim() : '';
      if (!text) { if (input) input.focus(); return; }
      entries.push({ id: 'u' + Date.now(), kind: 'user', text: text });
      state.composerText = '';
      state.queue.push({ id: 'q' + Date.now(), text: text });
      render(); return;
    }
    if (act === 'stop') { stopStream(); return; }
    if (act === 'stream-start') { startStream(); return; }
    if (act === 'stream-stop') { stopStream(); return; }
    if (act === 'conn') { state.connected = value === '1'; if (!state.connected) { state.demo = 'disconnected'; } else if (state.demo === 'disconnected') { state.demo = 'normal'; } render(); return; }
    if (act === 'settings-section') { state.settingsSection = value; render(); return; }
    if (act === 'usage-source') { state.usage.source = value; state.usage.unreachable = value === 'router'; render(); return; }
    if (act === 'usage-gran') { state.usage.gran = value; render(); return; }
    if (act === 'usage-dim') { state.usage.dim = value; render(); return; }
    if (act === 'usage-unreachable') { state.usage.unreachable = value === '1'; if (!state.usage.unreachable && state.usage.source === 'router') state.usage.source = 'all'; render(); return; }
    if (act === 'reset') {
      state.demo = 'normal'; state.connected = true; state.streaming = false; state.streamingText = '';
      state.approvals.forEach(function (a) { a.decision = null; });
      state.queue = [{ id: 'q1', text: '把错误的 status 文案补到 i18n 常量。' }, { id: 'q2', text: '检查 401 分支是否覆盖 WS 重连。' }];
      entries = initialEntries.map(function (en) { return Object.assign({}, en); });
      seamAfter = 'e5';
      state.errorVisible = true; render(); return;
    }
  });

  root.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'sb-reduced-toggle') { state.reduced = t.checked; render(); return; }
    if (t.id === 'sb-role-select') { state.role = t.value; if (state.role !== 'root' && state.settingsSection === 'users') state.settingsSection = 'general'; render(); return; }
    if (t.id === 'sb-demo-state') { state.demo = t.value; if (t.value === 'disconnected') state.connected = false; else state.connected = true; render(); return; }
  });

  root.addEventListener('input', function (e) {
    if (e.target.id === 'sb-composer-input') state.composerText = e.target.value;
  });

  root.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.drawerOpen) { state.drawerOpen = false; render(); var m = win.querySelector('[data-act="drawer-open"]'); if (m) m.focus(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('data-act') === 'select-project') { e.preventDefault(); e.target.click(); }
    if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'sb-composer-input' && !e.isComposing) {
      e.preventDefault();
      var send = win.querySelector('[data-act="send"]');
      if (send) send.click();
    }
  });

  root.addEventListener('submit', function (e) {
    if (e.target.id !== 'sb-auth-form') return;
    e.preventDefault();
    var form = e.target;
    var isSetup = form.getAttribute('data-mode') === 'setup';
    var user = form.querySelector('[name="username"]').value.trim();
    var pass = form.querySelector('[name="password"]').value;
    var pass2 = form.querySelector('[name="password2"]');
    var err = document.getElementById('sb-auth-error');
    var ok = document.getElementById('sb-auth-ok');
    err.textContent = ''; ok.textContent = '';
    if (!user) { err.textContent = '请输入用户名。'; return; }
    if (!pass) { err.textContent = '请输入密码。'; return; }
    if (isSetup && pass.length < 8) { err.textContent = '密码至少 8 位。'; return; }
    if (isSetup && pass2 && pass !== pass2.value) { err.textContent = '两次输入的密码不一致。'; return; }
    if (!isSetup && pass === 'wrong') { err.textContent = '用户名或密码不正确。'; return; }
    ok.textContent = isSetup ? '已创建 root（设计稿演示），进入工作台。' : '已登录（设计稿演示）。';
  });

  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
  if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (state.theme === 'system') render(); });

  render();
})();
</script>
</div>
