---
# config 变更触发的重启(design D3/D7 + 1b418be 修正):
# - 仅当 unit 已存在:首装时 unit 不在,install --auto-start 会用新 config 拉起,
#   flush 处重启不存在的单元是错误;
# - 仅当本轮 install 没发生:install.changed 时 install 已用新 config 拉起,
#   handler 再重启会违背「一次变更一次重启」。
# flush 发生在 install 之前,因此升级场景(config + 二进制同时变更)下此处
# 重启的是旧 seed —— 升级后的二进制生效由健康检查的 HTTP 兜底重启保证。
- name: Restart sebas
  ansible.builtin.systemd:
    name: sebas
    state: restarted
  when:
    - sebas_unit_stat.stat.exists
    - sebas_install is not defined or not (sebas_install.changed | default(false))
