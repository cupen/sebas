[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tracing = "0.1"
tokio = { version = "1.40", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
futures-core = "0.3"
http-body-util = "0.1"
chrono = "0.4"
dirs = "5"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
axum = "0.8"
serde_json = "1"
