[package]
name = "sebas-router"
version = "0.1.0"
edition = "2024"

[dependencies]
sebas-ipc = { path = "../sebas-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1.40", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"
futures-core = "0.3"
http-body-util = "0.1"
chrono = "0.4"
dirs = "7"

# 中立共享域层（add-domain-layer）：跨角色域概念的唯一定义处。
sebas-domain = { path = "../sebas-domain" }
# 持久层 runtime（extract-sebas-db）：连接配方 / schema 同步 / 单写 actor 的
# 唯一提供者。router 自有用量库 usage.db（persist-router-usage D1）——
# router **不**打开 core 的状态库。
sebas-db = { path = "../sebas-db" }
# 编译期 schema 提取：Row struct 即建表事实源（sqlite-auto-schema-sync D1）。
sebas-schema-derive = { path = "../sebas-schema-derive" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
axum = "0.8"
serde_json = "1"
