{# Sidebar snippet: renders only when there's an active session. Designed
   to be swapped by htmx via SSE so the sidebar indicator stays current
   across navigation without a full page refresh. #}
{% if active_session_key %}
<div class="sidebar-active-card">
  <div class="sidebar-active-label">Focused session</div>
  <a class="sidebar-active-link" href="/sessions/{{ active_session_key }}" hx-boost="true">
    <code>{{ active_session_key }}</code>
  </a>
  <button class="btn btn-sm btn-danger btn-close-sidebar"
          hx-post="/api/sessions/{{ active_session_key }}/close"
          hx-swap="none"
          hx-on::after-request="
            if(event.detail.successful) {
              window.location.href = '/sessions';
            }
          ">
    Close
  </button>
</div>
{% endif %}
