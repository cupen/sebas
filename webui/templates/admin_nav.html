{# Admin nav section, included by every admin page through base.html's
   `nav_admin` block. One copy, so the four pages cannot drift apart the way
   five hand-maintained shells did. #}
<div class="nav-section">
  <div class="nav-section-title">Admin</div>
  <a href="/admin/status" class="nav-item{{ " active" if page == "admin_status" else "" }}"
     {{- ' aria-current="page"' | safe if page == "admin_status" else "" }}>
    <span class="nav-label">Status</span>
  </a>
  <a href="/admin/events" class="nav-item{{ " active" if page == "admin_events" else "" }}"
     {{- ' aria-current="page"' | safe if page == "admin_events" else "" }}>
    <span class="nav-label">Events</span>
  </a>
  <a href="/admin/update" class="nav-item{{ " active" if page == "admin_update" else "" }}"
     {{- ' aria-current="page"' | safe if page == "admin_update" else "" }}>
    <span class="nav-label">Update</span>
  </a>
  <a href="/admin/services" class="nav-item{{ " active" if page == "admin_services" else "" }}"
     {{- ' aria-current="page"' | safe if page == "admin_services" else "" }}>
    <span class="nav-label">Services</span>
  </a>
</div>
<div class="nav-section">
  <form method="POST" action="/admin/logout">
    <button type="submit" class="nav-item nav-item-button">
      <span class="nav-label">Log out</span>
    </button>
  </form>
</div>
