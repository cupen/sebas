name: CI

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # openlark 的 lark-websocket-protobuf 构建时需要 protoc（prost-build）
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # fake-claude 与 sebas 都是集成测试的被测进程，必须先于测试构建
      # （sebas-gateway 的 process_e2e_test 会 spawn target/debug/sebas）。
      - run: cargo build --bin sebas --bin fake-claude
      # sebas-node 是独立二进制的执行节点（add-remote-execution-node）。
      # 必须带 -p：`--bin` 只在默认包里解析目标，跨包要显式指定包。
      - run: cargo build -p sebas-node --bin sebas-node
      - run: cargo test --workspace

  # 前端单测此前不在 CI 里，导致 ElementInternals 垫片缺失长期静默（vitest
  # 用例全过但整轮退出 1）。本 job 让该门禁可见；版本对齐 package.json 的
  # packageManager（pnpm@11.24.0）。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sebas-webui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sebas-webui/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
