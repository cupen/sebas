name: CI

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # openlark 的 lark-websocket-protobuf 构建时需要 protoc（prost-build）
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # fake-claude 与 sebas 都是集成测试的被测进程，必须先于测试构建
      # （sebas-gateway 的 process_e2e_test 会 spawn target/debug/sebas）。
      - run: cargo build --bin sebas --bin fake-claude
      - run: cargo test --workspace
