[package]
name = "sebas-im"
version = "0.1.0"
edition = "2024"

[dependencies]
sebas-channels = { path = "../sebas-channels" }
sebas-feishu = { path = "../sebas-feishu" }
sebas-dispatch = { path = "../sebas-dispatch" }
sebas-webui = { path = "../sebas-webui" }
async-trait = "0.1"
urlencoding = "2"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }

[dev-dependencies]
